name: build vita vpk
on:
  # Tagging still cuts a release, as before.
  push: {tags:  ['v*']} #  Push events to matching v*, i.e. v1.0, v20.15.10
  # Build on demand, and on pushes that touch the sources, so breakage is
  # caught without having to tag a release first.
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'CMakeLists.txt', 'script/**', '.github/workflows/**']
env:
  VITASDK: /opt/vitasdk
  # Changing install_vitasdk.sh invalidates the cached SDK, so a fix to the
  # install never has to fight a stale cache.
  VITASDK_CACHE_KEY: vitasdk-3
jobs:
  install_vitasdk:
    runs-on: ubuntu-latest # default batch, powershell
    steps:
    # Full history: the version is derived from the commit count, and
    # checkout's default shallow clone reports 1 for every build, which
    # made every vpk claim version 01.01.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: check for a cached vitasdk
      id: check_vitasdk
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VITASDK }}
        key: ${{ env.VITASDK_CACHE_KEY }}-${{ hashFiles('script/install_vitasdk.sh', 'script/build_ffmpeg.sh') }}
        lookup-only: true
    - name: install vitasdk
      if: steps.check_vitasdk.outputs.cache-hit != 'true'
      run: cd ./script && bash install_vitasdk.sh ${{ env.VITASDK }}
    # The packaged ffmpeg decodes no MPEG-1/2, H.264 or WMV video, so we
    # build one that does. It goes into the same tree, under the same cache
    # key, so a change to either script rebuilds both rather than pairing a
    # new engine with a stale library.
    - name: build ffmpeg with the video decoders
      if: steps.check_vitasdk.outputs.cache-hit != 'true'
      run: cd ./script && bash build_ffmpeg.sh ${{ env.VITASDK }}
    # Saved explicitly, and only on success: a failed install used to be
    # cached anyway, so every later run restored a broken SDK and skipped
    # reinstalling it.
    - name: save vitasdk cache
      if: success() && steps.check_vitasdk.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VITASDK }}
        key: ${{ env.VITASDK_CACHE_KEY }}-${{ hashFiles('script/install_vitasdk.sh', 'script/build_ffmpeg.sh') }}

  build_vitaonsjh:
    runs-on: ubuntu-latest
    needs: install_vitasdk
    steps:
    # Full history: the version is derived from the commit count, and
    # checkout's default shallow clone reports 1 for every build, which
    # made every vpk claim version 01.01.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.16.x' # the default cmake has error! to generate like onsjh.self-self
    - name: get vitasdk cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VITASDK }}
        key: ${{ env.VITASDK_CACHE_KEY }}-${{ hashFiles('script/install_vitasdk.sh', 'script/build_ffmpeg.sh') }}
        fail-on-cache-miss: true
    - name: build vpk
      run: cd ./script && bash build_vitavpk.sh vpk
    # vita-elf-create needs a few kilobytes of address space after the code
    # segment for the SCE module data, and refuses to run when the next
    # segment starts sooner. Print the segment table whether the build
    # succeeded or not, so that failure is diagnosable from the log instead
    # of by guesswork.
    - name: segment layout of the linked binaries
      if: always()
      run: |
        for f in build/src/onsjh_vitagui/onsjh_vitagui build/src/onsjh/onsjh; do
          echo "=== $f"
          [ -f "$f" ] && $VITASDK/bin/arm-vita-eabi-readelf -lW "$f" | sed -n '1,30p' || echo "not built"
        done
    - name: upload build
      uses: actions/upload-artifact@v4
      with:
        name: VitaOns-vpk
        path: build/VitaOns.vpk
        if-no-files-found: error
    # Only tagged builds are published as a release.
    - name: create a release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: ncipollo/release-action@v1
      with:
        artifacts: "./build/VitaOns.vpk"
        allowUpdates: "true"
        token: ${{ secrets.GITHUB_TOKEN }}
